name: Antalia Android experiment

on:
  push:
    branches:
      - experiment/antalia-mini-onnx-android-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit tests, and debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antalia-experiment-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
